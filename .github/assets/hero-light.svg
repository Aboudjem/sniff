<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none" role="img"
     aria-label="sniff, browser QA for your running app: finds what is actually broken, with proof">
  <title>sniff</title>
  <defs>
    <linearGradient id="sf-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#EEF1F7"/>
    </linearGradient>
    <radialGradient id="sf-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#C10045" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C10045" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#8A2CD1" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8A2CD1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#5D4BD1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5D4BD1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#C10045" stop-opacity="0.07"/>
      <stop offset="42%"  stop-color="#8A2CD1" stop-opacity="0.043"/>
      <stop offset="76%"  stop-color="#5D4BD1" stop-opacity="0.016"/>
      <stop offset="100%" stop-color="#5D4BD1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sf-frame"><rect width="1200" height="400"/></clipPath>
    <linearGradient id="sf-rule" gradientUnits="userSpaceOnUse" x1="500" y1="100" x2="500" y2="300">
      <stop offset="0%"   stop-color="#C10045" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#C10045" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A2CD1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sf-ink" gradientUnits="userSpaceOnUse" x1="40" y1="88" x2="200" y2="200">
      <stop class="sfk1" offset="0%"   stop-color="#C10045"/>
      <stop class="sfk2" offset="52%"  stop-color="#C10045"/>
      <stop class="sfk3" offset="100%" stop-color="#8A2CD1"/>
    </linearGradient>
    <clipPath id="sf-lens" clipPathUnits="userSpaceOnUse">
      <circle cx="128" cy="130" r="41"/>
    </clipPath>
    <linearGradient id="sf-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="sfk1" offset="0%"   stop-color="#C10045"/>
      <stop class="sfk2" offset="46%"  stop-color="#C10045"/>
      <stop class="sfk3" offset="100%" stop-color="#8A2CD1"/>
    </linearGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #C10045; }
    .head    { font-size: 28px; font-weight: 700; fill: #1A2233; letter-spacing: -0.5px; }
    .sub     { font-size: 16.5px; font-weight: 500; fill: #48546B; }
    .tag     { font-size: 11.5px; letter-spacing: 1.6px; fill: #48546B; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #48546B; }
    @keyframes sf-breathe { 0%,100% { opacity:0.72; } 50% { opacity:1; } }
    .sfbloom { animation: sf-breathe 11s ease-in-out infinite; }
    @keyframes sf-sweep { 0% { transform: translateX(-360px); } 100% { transform: translateX(1560px); } }
    .sfwash { animation: sf-sweep 17s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes sf-pip { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .sfp1 { animation: sf-pip 5s ease-in-out infinite 0.0s; }
    .sfp2 { animation: sf-pip 5s ease-in-out infinite 0.35s; }
    .sfp3 { animation: sf-pip 5s ease-in-out infinite 0.7s; }
    .sfp4 { animation: sf-pip 5s ease-in-out infinite 1.05s; }
    .sfp5 { animation: sf-pip 5s ease-in-out infinite 1.4s; }
    .sfp6 { animation: sf-pip 5s ease-in-out infinite 1.75s; }
    .sfp7 { animation: sf-pip 5s ease-in-out infinite 2.1s; }
    .sfp8 { animation: sf-pip 5s ease-in-out infinite 2.45s; }
    .sfp9 { animation: sf-pip 5s ease-in-out infinite 2.8s; }
    .sfp10 { animation: sf-pip 5s ease-in-out infinite 3.15s; }
    .sfp11 { animation: sf-pip 5s ease-in-out infinite 3.5s; }
    .sfp12 { animation: sf-pip 5s ease-in-out infinite 3.85s; }
    @keyframes sf-scan { 0%,100% { transform: translateX(-48px); } 50% { transform: translateX(48px); } }
    @keyframes sf-scani { 0%,100% { transform: translateX(48px); } 50% { transform: translateX(-48px); } }
    /* base transform parks the lens over the flagged row, so the resting frame is the
       "found it" state rather than an arbitrary point of the sweep */
    .sfscan  { transform: translateX(20px);  animation: sf-scan 7s ease-in-out infinite; }
    .sfscani { transform: translateX(-20px); animation: sf-scani 7s ease-in-out infinite; }
    @keyframes sf-flare { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .sfflare { animation: sf-flare 3.5s ease-in-out infinite; }
    @keyframes sf-k1 { 0%,100% { stop-color:#C10045; } 50% { stop-color:#8A2CD1; } }
    @keyframes sf-k2 { 0%,100% { stop-color:#C10045; } 50% { stop-color:#C10045; } }
    @keyframes sf-k3 { 0%,100% { stop-color:#8A2CD1; } 50% { stop-color:#5D4BD1; } }
    .sfk1 { animation: sf-k1 14s ease-in-out infinite; }
    .sfk2 { animation: sf-k2 14s ease-in-out infinite; }
    .sfk3 { animation: sf-k3 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="400" fill="url(#sf-ground)"/>
  <g class="sfbloom">
    <rect width="1200" height="400" fill="url(#sf-bloomA)"/>
    <rect width="1200" height="400" fill="url(#sf-bloomB)"/>
    <rect width="1200" height="400" fill="url(#sf-bloomC)"/>
  </g>
  <g clip-path="url(#sf-frame)">
    <g transform="translate(0,196)">
      <ellipse class="sfwash" cx="0" cy="0" rx="430" ry="300" fill="url(#sf-wash)"/>
    </g>
  </g>
  <g transform="translate(66,56) scale(0.5781)">
  <g opacity="0.19" fill="url(#sf-ink)"><rect x="38" y="98" width="180" height="14" rx="7"/><rect x="38" y="126" width="132" height="14" rx="7"/><rect x="38" y="154" width="162" height="14" rx="7"/><circle cx="150" cy="133" r="7"/></g>
  <g class="sfscan">
    <g clip-path="url(#sf-lens)">
      <g class="sfscani" fill="url(#sf-ink)"><rect x="38" y="98" width="180" height="14" rx="7"/><rect x="38" y="126" width="132" height="14" rx="7"/><rect x="38" y="154" width="162" height="14" rx="7"/></g>
    </g>
  </g>
  <g class="sfflare" fill="url(#sf-ink)"><circle cx="150" cy="133" r="7"/></g>
  <g class="sfscan">
    <g>
      <line x1="159" y1="161" x2="196" y2="198" stroke="url(#sf-ink)"
            stroke-width="13" stroke-linecap="round"/>
      <circle cx="128" cy="130" r="44" fill="none" stroke="url(#sf-ink)" stroke-width="11"/>
    </g>
  </g>
  </g>
  <g>
    <text class="disp" x="76" y="286" font-size="128" font-weight="800"
          letter-spacing="-4.5" fill="url(#sf-word)">sniff</text>
  </g>
  <line x1="500" y1="100" x2="500" y2="300" stroke="url(#sf-rule)" stroke-width="1.5"/>
  <g transform="translate(544,0)">
    <text class="mono eyebrow" x="0" y="134">BROWSER QA FOR YOUR RUNNING APP</text>
    <text class="disp head" x="0" y="186">Finds what is actually broken, with proof</text>
    <text class="disp sub" x="0" y="222">Walks your real user flows in a real browser. No API key.</text>
    <g transform="translate(0,265)"><g class="sfp1"><circle cx="0" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp2"><circle cx="22" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp3"><circle cx="44" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp4"><circle cx="66" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp5"><circle cx="88" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp6"><circle cx="110" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp7"><circle cx="132" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp8"><circle cx="154" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp9"><circle cx="176" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp10"><circle cx="198" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp11"><circle cx="220" cy="0" r="4.5" fill="#C10045"/></g><g class="sfp12"><circle cx="242" cy="0" r="4.5" fill="#C10045"/></g><text class="mono tag" x="278" y="4">12 CLASSES OF BUGS</text></g>
  </g>
  <g transform="translate(76,330)"><rect x="0" y="0" width="113" height="26" rx="13" fill="none" stroke="#D8DEE9" stroke-width="1"/><text class="mono chip" x="16" y="17">no api key</text><rect x="125" y="0" width="129" height="26" rx="13" fill="none" stroke="#D8DEE9" stroke-width="1"/><text class="mono chip" x="141" y="17">real browser</text><rect x="266" y="0" width="129" height="26" rx="13" fill="none" stroke="#D8DEE9" stroke-width="1"/><text class="mono chip" x="282" y="17">runs locally</text></g>
</svg>
