<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-label="Sniff flow: your running app, walked in a headless browser, produces findings with reproduction proof">
  <style>
    .bg-grid { stroke: #ef4444; stroke-width: 1; opacity: 0.05; }
    .frame { fill: #0b0b0f; stroke: #ef4444; stroke-width: 1.5; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #e5e7eb; }
    .mono-dim { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; }
    .title { font-family: 'SF Pro Display', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #f3f4f6; }
    .label { font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #ef4444; letter-spacing: 0.5px; }
    .flow-path { stroke: #ef4444; stroke-width: 1.5; opacity: 0.35; fill: none; stroke-dasharray: 3 4; }

    /* cursor walking the app — moves between targets */
    @keyframes cursor-walk {
      0%   { transform: translate(0,0); }
      25%  { transform: translate(118px,4px); }
      50%  { transform: translate(70px,52px); }
      75%  { transform: translate(150px,86px); }
      100% { transform: translate(0,0); }
    }
    .cursor { animation: cursor-walk 5s ease-in-out infinite; transform-box: fill-box; }

    /* click pulse where the cursor lands */
    @keyframes click-ring {
      0%, 100% { r: 4; opacity: 0; }
      40% { r: 4; opacity: 0.9; }
      70% { r: 16; opacity: 0; }
    }
    .click-1 { animation: click-ring 5s ease-out infinite 1.2s; }
    .click-2 { animation: click-ring 5s ease-out infinite 2.5s; }
    .click-3 { animation: click-ring 5s ease-out infinite 3.8s; }

    /* finding row — staggered slide-in, stays visible */
    @keyframes finding-slide {
      0% { opacity: 0; transform: translateX(14px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .finding-row-1 { animation: finding-slide 0.6s ease-out 0.4s both; }
    .finding-row-2 { animation: finding-slide 0.6s ease-out 0.9s both; }
    .finding-row-3 { animation: finding-slide 0.6s ease-out 1.4s both; }

    /* severity dot pulse */
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.75; }
    }
    .sev-dot-1 { animation: dot-pulse 2.2s ease-in-out infinite 1.2s; transform-origin: center; transform-box: fill-box; }
    .sev-dot-2 { animation: dot-pulse 2.2s ease-in-out infinite 1.7s; transform-origin: center; transform-box: fill-box; }
    .sev-dot-3 { animation: dot-pulse 2.2s ease-in-out infinite 2.2s; transform-origin: center; transform-box: fill-box; }

    /* live network/console blips ticking in the browser */
    @keyframes tick { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
    .tick-1 { animation: tick 1.6s ease-in-out infinite; }
    .tick-2 { animation: tick 1.6s ease-in-out infinite 0.4s; }
    .tick-3 { animation: tick 1.6s ease-in-out infinite 0.8s; }

    /* command prompt glow */
    @keyframes cmd-glow {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .cmd-frame { animation: cmd-glow 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .click-1, .click-2, .click-3, .sev-dot-1, .sev-dot-2, .sev-dot-3,
      .tick-1, .tick-2, .tick-3, .cmd-frame { animation: none !important; }
      .finding-row-1, .finding-row-2, .finding-row-3 {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
      .click-1, .click-2, .click-3 { opacity: 0 !important; }
    }
  </style>

  <defs>
    <pattern id="grid-sniff" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" class="bg-grid"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#grid-sniff)"/>

  <!-- STAGE 1: your running app -->
  <g transform="translate(40,80)">
    <text x="0" y="-10" class="label">01 · YOUR RUNNING APP</text>
    <rect x="0" y="0" width="260" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">localhost:3000</text>

    <!-- traffic lights -->
    <g transform="translate(20,42)">
      <circle cx="0" cy="0" r="3.5" fill="#ef4444" opacity="0.9"/>
      <circle cx="11" cy="0" r="3.5" fill="#f59e0b" opacity="0.9"/>
      <circle cx="22" cy="0" r="3.5" fill="#10b981" opacity="0.9"/>
    </g>

    <!-- rendered app surface (a real page, not source) -->
    <g transform="translate(20,56)">
      <rect x="0" y="0" width="220" height="132" rx="6" fill="#11131a" stroke="#ef4444" stroke-opacity="0.18"/>
      <!-- nav bar -->
      <rect x="12" y="12" width="60" height="8" rx="3" fill="#f3f4f6" fill-opacity="0.55"/>
      <rect x="150" y="12" width="26" height="8" rx="3" fill="#9ca3af" fill-opacity="0.4"/>
      <rect x="182" y="12" width="26" height="8" rx="3" fill="#9ca3af" fill-opacity="0.4"/>
      <!-- hero text -->
      <rect x="12" y="36" width="120" height="9" rx="3" fill="#f3f4f6" fill-opacity="0.5"/>
      <rect x="12" y="50" width="96" height="6" rx="2" fill="#9ca3af" fill-opacity="0.35"/>
      <!-- primary button (a click target) -->
      <rect x="12" y="66" width="64" height="20" rx="5" fill="#ef4444" fill-opacity="0.85"/>
      <text x="44" y="80" text-anchor="middle" font-family="Menlo,monospace" font-size="9" fill="#fff">Sign up</text>
      <!-- form field (a fill target) -->
      <rect x="12" y="98" width="150" height="16" rx="4" fill="#0b0b0f" stroke="#ef4444" stroke-opacity="0.3"/>
      <rect x="20" y="103" width="60" height="6" rx="2" fill="#6b7280"/>

      <!-- click rings where the walker interacts -->
      <circle cx="44" cy="76" r="4" fill="none" stroke="#ef4444" stroke-width="1.5" class="click-1"/>
      <circle cx="90" cy="106" r="4" fill="none" stroke="#f59e0b" stroke-width="1.5" class="click-2"/>
      <circle cx="160" cy="16" r="4" fill="none" stroke="#10b981" stroke-width="1.5" class="click-3"/>

      <!-- the walker's cursor moving across the app -->
      <g class="cursor">
        <path d="M 40 70 L 40 84 L 44 80 L 48 86 L 50 84 L 46 79 L 52 78 Z" fill="#f3f4f6" stroke="#0b0b0f" stroke-width="0.6"/>
      </g>
    </g>
  </g>

  <!-- flow arrow -->
  <path d="M 310 180 L 450 180" class="flow-path"/>
  <circle r="4" fill="#ef4444"><animateMotion dur="2s" repeatCount="indefinite" path="M 310 180 L 450 180"/></circle>
  <circle r="3" fill="#ef4444" opacity="0.5"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 310 180 L 450 180"/></circle>

  <!-- STAGE 2: headless browser walk -->
  <g transform="translate(460,80)">
    <text x="0" y="-10" class="label">02 · HEADLESS BROWSER WALK</text>
    <rect x="0" y="0" width="240" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">Walk the flows</text>

    <!-- what the walker does -->
    <g transform="translate(20,46)" font-family="Menlo,monospace" font-size="10" fill="#9ca3af">
      <circle cx="4" cy="-3" r="2.5" fill="#ef4444"/>
      <text x="16" y="0">open pages</text>
      <circle cx="4" cy="17" r="2.5" fill="#ef4444"/>
      <text x="16" y="20">click buttons</text>
      <circle cx="4" cy="37" r="2.5" fill="#ef4444"/>
      <text x="16" y="40">fill &amp; submit forms</text>
      <circle cx="4" cy="57" r="2.5" fill="#ef4444"/>
      <text x="16" y="60">follow links, go back</text>
    </g>

    <!-- watching console + network as it walks -->
    <g transform="translate(20,120)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#11131a" stroke="#ef4444" stroke-opacity="0.18"/>
      <text x="10" y="16" font-family="Menlo,monospace" font-size="9" fill="#6b7280">watching console + network</text>
      <g transform="translate(10,26)">
        <rect class="tick-1" x="0" y="0" width="150" height="6" rx="2" fill="#ef4444" fill-opacity="0.55"/>
        <rect class="tick-2" x="0" y="12" width="120" height="6" rx="2" fill="#f59e0b" fill-opacity="0.55"/>
        <rect class="tick-3" x="0" y="24" width="170" height="6" rx="2" fill="#10b981" fill-opacity="0.5"/>
      </g>
    </g>
    <text x="120" y="196" text-anchor="middle" class="mono-dim">desktop + 375px mobile pass</text>
  </g>

  <!-- flow arrow -->
  <path d="M 710 180 L 850 180" class="flow-path"/>
  <circle r="4" fill="#ef4444"><animateMotion dur="2s" repeatCount="indefinite" path="M 710 180 L 850 180"/></circle>
  <circle r="3" fill="#ef4444" opacity="0.5"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 710 180 L 850 180"/></circle>

  <!-- STAGE 3: findings with proof -->
  <g transform="translate(860,80)">
    <text x="0" y="-10" class="label">03 · FINDINGS WITH PROOF</text>
    <rect x="0" y="0" width="300" height="200" rx="12" class="frame"/>
    <text x="20" y="28" class="title">Route · steps · screenshot</text>

    <g transform="translate(20,48)">
      <!-- finding row 1 -->
      <g class="finding-row-1">
        <rect x="0" y="0" width="260" height="30" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.4"/>
        <circle cx="14" cy="15" r="4" fill="#ef4444" class="sev-dot-1"/>
        <text x="28" y="13" class="mono">dead submit button</text>
        <text x="28" y="25" class="mono-dim">/signup · 3 steps · shot</text>
      </g>

      <!-- finding row 2 -->
      <g transform="translate(0,38)">
        <g class="finding-row-2">
          <rect x="0" y="0" width="260" height="30" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.4"/>
          <circle cx="14" cy="15" r="4" fill="#f59e0b" class="sev-dot-2"/>
          <text x="28" y="13" class="mono">form wiped on back</text>
          <text x="28" y="25" class="mono-dim">/checkout · 4 steps · shot</text>
        </g>
      </g>

      <!-- finding row 3 -->
      <g transform="translate(0,76)">
        <g class="finding-row-3">
          <rect x="0" y="0" width="260" height="30" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.4"/>
          <circle cx="14" cy="15" r="4" fill="#10b981" class="sev-dot-3"/>
          <text x="28" y="13" class="mono">missing alt text</text>
          <text x="28" y="25" class="mono-dim">/gallery · axe-core · shot</text>
        </g>
      </g>

      <!-- fix suggestion -->
      <g transform="translate(0,120)">
        <rect x="0" y="0" width="260" height="24" rx="6" fill="#0b0b0f" stroke="#ef4444" stroke-opacity="0.6" class="cmd-frame"/>
        <text x="12" y="16" font-family="Menlo,monospace" font-size="10" fill="#ef4444" font-weight="600">›  /sniff-fix  · apply safe fixes</text>
      </g>
    </g>
  </g>

  <!-- bottom caption -->
  <text x="600" y="335" text-anchor="middle" font-family="Menlo,monospace" font-size="10" fill="#6b7280" letter-spacing="0.5">npx sniff-qa  ·  auto-detects your dev server  ·  no config, no api keys</text>
</svg>
