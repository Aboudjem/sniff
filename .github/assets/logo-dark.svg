<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="sniff: a tiny cat that sniffs out bugs before your users do">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="bloomg" cx="0.5" cy="1" r="0.75">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#FF2D78"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.12 0; 0.12 0; -0.12 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB341"/>
      <stop offset="45%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="horizonline" gradientUnits="userSpaceOnUse" x1="40" y1="188" x2="700" y2="188">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="24%" stop-color="#00D4FF" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#C77DFF" stop-opacity="0.72"/>
      <stop offset="84%" stop-color="#FF2D78" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gridfade" gradientUnits="userSpaceOnUse" x1="0" y1="188" x2="0" y2="200">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="sheeng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2F6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F2F6FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glow-atmo" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="sunclip"><circle cx="656" cy="156" r="32"/></clipPath>
    <clipPath id="gridclip"><rect x="0" y="188" width="720" height="12"/></clipPath>
    <clipPath id="wordclip">
      <text x="168" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="62" font-weight="800" letter-spacing="-1">sniff</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sub  { font-size: 15px; font-weight: 500; fill: #B6C2DA; }
    .cmd  { font-size: 12.5px; letter-spacing: 0.6px; fill: #FF4D8D; }
    .tag  { font-size: 10.6px; letter-spacing: 0.7px; fill: #8494B0; }

    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .bloom { animation: breathe 9s ease-in-out infinite; }

    @keyframes sunpulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.62; } }
    .sun { animation: sunpulse 10s ease-in-out infinite; }

    @keyframes flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: flow 14s linear infinite; }

    @keyframes pip { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .t1 { animation: pip 5s ease-in-out infinite 0s; }
    .t2 { animation: pip 5s ease-in-out infinite 0.35s; }
    .t3 { animation: pip 5s ease-in-out infinite 0.7s; }
    .t4 { animation: pip 5s ease-in-out infinite 1.05s; }
    .t5 { animation: pip 5s ease-in-out infinite 1.4s; }

    @keyframes sheen {
      0%   { transform: translateX(0); }
      34%  { transform: translateX(480px); }
      100% { transform: translateX(480px); }
    }
    .sheen { animation: sheen 7.5s linear infinite; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="720" height="200" fill="url(#bg)"/>
  <ellipse class="bloom" cx="360" cy="206" rx="440" ry="118" fill="url(#bloomg)"/>

  <!-- sun disc on the horizon, right edge, fully inside the canvas -->
  <g class="sun">
    <g filter="url(#glow-atmo)"><circle cx="656" cy="156" r="32" fill="url(#sun)"/></g>
    <g clip-path="url(#sunclip)" fill="#080C16">
      <rect x="618" y="162" width="76" height="1.6"/>
      <rect x="618" y="168" width="76" height="2.2"/>
      <rect x="618" y="175" width="76" height="3"/>
      <rect x="618" y="183" width="76" height="4.2"/>
    </g>
  </g>

  <!-- perspective grid below the horizon, shipped off -->
  <g id="grid" clip-path="url(#gridclip)" opacity="0">
    <g stroke="url(#gridfade)" stroke-width="1" fill="none">
      <path d="M360 188 L-360 200"/><path d="M360 188 L40 200"/><path d="M360 188 L200 200"/>
      <path d="M360 188 L300 200"/><path d="M360 188 L360 200"/><path d="M360 188 L420 200"/>
      <path d="M360 188 L520 200"/><path d="M360 188 L680 200"/><path d="M360 188 L1080 200"/>
      <line x1="0" y1="191" x2="720" y2="191"/>
      <line x1="0" y1="194" x2="720" y2="194"/>
      <line x1="0" y1="197" x2="720" y2="197"/>
    </g>
  </g>

  <g opacity="0.95">
    <line x1="40" y1="188" x2="700" y2="188" stroke="url(#horizonline)" stroke-width="1.25"/>
    <line class="flowline" x1="40" y1="188" x2="700" y2="188" stroke="url(#horizonline)"
          stroke-width="1.25" stroke-dasharray="3 9" opacity="0.85"/>
  </g>

  <!-- mark: loupe circle with a dotted trail curving into it -->
  <g transform="translate(88,84)">
    <g filter="url(#glow)">
      <circle cx="8" cy="-10" r="21" stroke="url(#brand)" stroke-width="5.5" fill="none"/>
      <path d="M-2 -24 A 15 15 0 0 0 -6 -14" stroke="#F2F6FF" stroke-width="2.4"
            stroke-linecap="round" fill="none" opacity="0.55"/>
      <g fill="#FF4D8D">
        <circle class="t1" cx="-13" cy="13" r="4.6"/>
        <circle class="t2" cx="-23" cy="22" r="3.8"/>
        <circle class="t3" cx="-34" cy="30" r="3.1"/>
        <circle class="t4" cx="-46" cy="36" r="2.4"/>
        <circle class="t5" cx="-59" cy="40" r="1.8"/>
      </g>
    </g>
  </g>

  <text class="disp" x="168" y="96" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#brand)">sniff</text>

  <g clip-path="url(#wordclip)">
    <g transform="skewX(-18)">
      <rect class="sheen" x="-120" y="26" width="56" height="90" fill="url(#sheeng)" opacity="0.7"/>
    </g>
  </g>

  <text class="disp sub" x="170" y="124">a tiny cat that sniffs out bugs before your users do</text>

  <rect x="168" y="134" width="146" height="24" rx="12" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
  <text class="mono cmd" x="181" y="150">$ npx sniff-qa</text>

  <text class="mono tag" x="170" y="176">walks your app · finds real bugs · zero config · no api key</text>
</svg>
