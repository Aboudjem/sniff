<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="sniff. Find broken pages before users do. A map of app pages: the browser walk reaches /crash, which returns HTTP 500, with its two repro steps. Bugs caught before users, steps to repeat it, broken merges blocked. Command: npx sniff-qa --url http://localhost:3000. Works with any MCP client, agent skills and the CLI.">
  <title>sniff: find broken pages before users do</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1024"/>
      <stop offset="60%" stop-color="#0A0F1C"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- wordmark and headline -->
  <g transform="translate(72,58)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#FF4D8D" stroke-width="5"/>
    <line x1="31" y1="31" x2="43" y2="43" stroke="#FF4D8D" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="128" y="94" class="sans" font-size="38" font-weight="800" letter-spacing="-1" fill="#FF4D8D">sniff</text>
  <text x="72" y="200" class="sans" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#F2F6FF">Find broken pages</text>
  <text x="72" y="276" class="sans" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#F2F6FF">before users do</text>
  <text x="72" y="330" class="sans" font-size="24" font-weight="500" fill="#C2CDE4">A real browser clicks through your running app.</text>

  <!-- page map: links between pages, the browser walk in pink, one broken page -->
  <g>
    <line x1="780" y1="87" x2="795" y2="187" stroke="#3A4664" stroke-width="2"/>
    <line x1="795" y1="187" x2="975" y2="275" stroke="#3A4664" stroke-width="2"/>
    <line x1="965" y1="87" x2="975" y2="275" stroke="#3A4664" stroke-width="2"/>
    <line x1="780" y1="87" x2="965" y2="87" stroke="#FF4D8D" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <line x1="965" y1="87" x2="1149" y2="87" stroke="#FF4D8D" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <line x1="1149" y1="87" x2="1139" y2="187" stroke="#FF4D8D" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <line x1="1139" y1="187" x2="975" y2="275" stroke="#FF4D8D" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <rect x="720" y="64" width="120" height="46" rx="10" fill="#141B2E" stroke="#3A4664" stroke-width="2"/><text x="780" y="94" text-anchor="middle" class="mono" font-size="19" fill="#C2CDE4">/</text>
    <rect x="900" y="64" width="130" height="46" rx="10" fill="#141B2E" stroke="#3A4664" stroke-width="2"/><text x="965" y="94" text-anchor="middle" class="mono" font-size="19" fill="#C2CDE4">/signup</text>
    <rect x="1090" y="64" width="118" height="46" rx="10" fill="#141B2E" stroke="#3A4664" stroke-width="2"/><text x="1149" y="94" text-anchor="middle" class="mono" font-size="19" fill="#C2CDE4">/wide</text>
    <rect x="720" y="164" width="150" height="46" rx="10" fill="#141B2E" stroke="#3A4664" stroke-width="2"/><text x="795" y="194" text-anchor="middle" class="mono" font-size="19" fill="#C2CDE4">/dashboard</text>
    <rect x="1070" y="164" width="138" height="46" rx="10" fill="#141B2E" stroke="#3A4664" stroke-width="2"/><text x="1139" y="194" text-anchor="middle" class="mono" font-size="19" fill="#C2CDE4">/checkout</text>
    <rect x="890" y="252" width="170" height="46" rx="10" fill="#3A0F1C" stroke="#FF4D5E" stroke-width="3"/>
    <text x="908" y="282" class="mono" font-size="19" font-weight="700" fill="#FF4D5E">/crash  500</text>
    <text x="850" y="332" class="mono" font-size="17" fill="#C2CDE4">- Navigate to /crash</text>
    <text x="850" y="356" class="mono" font-size="17" fill="#C2CDE4">- Server responded with HTTP 500</text>
  </g>

  <!-- the three benefits -->
  <rect x="72" y="392" width="362" height="58" rx="29" fill="#161E33" stroke="#FF4D8D" stroke-width="2"/>
  <text x="253" y="429" text-anchor="middle" class="sans" font-size="23" font-weight="700" fill="#F2F6FF">Bugs caught before users</text>
  <rect x="459" y="392" width="362" height="58" rx="29" fill="#161E33" stroke="#FF4D8D" stroke-width="2"/>
  <text x="640" y="429" text-anchor="middle" class="sans" font-size="23" font-weight="700" fill="#F2F6FF">Steps to repeat it</text>
  <rect x="846" y="392" width="362" height="58" rx="29" fill="#161E33" stroke="#FF4D8D" stroke-width="2"/>
  <text x="1027" y="429" text-anchor="middle" class="sans" font-size="23" font-weight="700" fill="#F2F6FF">Broken merges blocked</text>

  <!-- the one command -->
  <rect x="72" y="476" width="1136" height="64" rx="12" fill="#05080F" stroke="#2A3552" stroke-width="2"/>
  <text x="100" y="517" class="mono" font-size="26" fill="#FF8FB4">$</text>
  <text x="130" y="517" class="mono" font-size="26" fill="#F2F6FF">npx sniff-qa --url http://localhost:3000</text>

  <!-- works with -->
  <text x="72" y="590" class="sans" font-size="20" font-weight="600" fill="#93A2BE">Works with: any MCP client · agent skills · CLI · Tested: Claude Code, Codex CLI</text>
</svg>
