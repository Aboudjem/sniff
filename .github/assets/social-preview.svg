<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img"
     aria-label="sniff: Walks your app. Finds real bugs. Zero config.">
  <title>sniff</title>
  <defs>
    <linearGradient id="sf-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1A1024"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <radialGradient id="sf-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#C77DFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF8FB4" stop-opacity="0.20"/>
      <stop offset="42%"  stop-color="#FF2D78" stop-opacity="0.124"/>
      <stop offset="76%"  stop-color="#C77DFF" stop-opacity="0.046"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sf-frame"><rect width="1280" height="640"/></clipPath>
    <linearGradient id="sf-ink" gradientUnits="userSpaceOnUse" x1="40" y1="88" x2="200" y2="200">
      <stop class="sfk1" offset="0%"   stop-color="#FF8FB4"/>
      <stop class="sfk2" offset="52%"  stop-color="#FF4D8D"/>
      <stop class="sfk3" offset="100%" stop-color="#FF7AA8"/>
    </linearGradient>
    <filter id="sf-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sf-glow-sm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sf-lens" clipPathUnits="userSpaceOnUse">
      <circle cx="128" cy="130" r="41"/>
    </clipPath>
    <linearGradient id="sf-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="sfk1" offset="0%"   stop-color="#FF8FB4"/>
      <stop class="sfk2" offset="46%"  stop-color="#FF4D8D"/>
      <stop class="sfk3" offset="100%" stop-color="#FF7AA8"/>
    </linearGradient>
    <linearGradient id="sf-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sf-wordclip">
      <text x="96" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="122" font-weight="800" letter-spacing="-4.3">sniff</text>
    </clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 4.5px; fill: #FF8FB4; }
    .head    { font-size: 31px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 20px; font-weight: 500; fill: #C2CDE4; }
    .tag     { font-size: 15px; letter-spacing: 1.6px; fill: #93A2BE; }
    .chip    { font-size: 11.5px; letter-spacing: 1.2px; fill: #C2CDE4; }
    .chipbig { font-size: 17px; letter-spacing: 1px; fill: #C2CDE4; }
    .tagsm { font-size: 12.5px; letter-spacing: 1.6px; fill: #93A2BE; }
    .eyebrow { font-size: 17px; letter-spacing: 5px; }
    @keyframes sf-breathe { 0%,100% { opacity:0.62; } 50% { opacity:1; } }
    .sfbloom { animation: sf-breathe 11s ease-in-out infinite; }
    @keyframes sf-sweep { 0% { transform: translateX(-360px); } 100% { transform: translateX(1640px); } }
    .sfwash { animation: sf-sweep 19s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes sf-sheen { 0% { transform: translateX(0); } 15%,100% { transform: translateX(561px); } }
    .sfsheen { animation: sf-sheen 8.5s cubic-bezier(.4,0,.3,1) infinite; }
    @keyframes sf-scan { 0%,100% { transform: translateX(-48px); } 50% { transform: translateX(48px); } }
    @keyframes sf-scani { 0%,100% { transform: translateX(48px); } 50% { transform: translateX(-48px); } }
    /* base transform parks the lens over the flagged row, so the resting frame is the
       "found it" state rather than an arbitrary point of the sweep */
    .sfscan  { transform: translateX(20px);  animation: sf-scan 7s ease-in-out infinite; }
    .sfscani { transform: translateX(-20px); animation: sf-scani 7s ease-in-out infinite; }
    @keyframes sf-flare { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .sfflare { animation: sf-flare 3.5s ease-in-out infinite; }
    @keyframes sf-k1 { 0%,100% { stop-color:#FF8FB4; } 50% { stop-color:#FF4D8D; } }
    @keyframes sf-k2 { 0%,100% { stop-color:#FF4D8D; } 50% { stop-color:#FF7AA8; } }
    @keyframes sf-k3 { 0%,100% { stop-color:#FF7AA8; } 50% { stop-color:#FF8FB4; } }
    .sfk1 { animation: sf-k1 14s ease-in-out infinite; }
    .sfk2 { animation: sf-k2 14s ease-in-out infinite; }
    .sfk3 { animation: sf-k3 14s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="640" fill="url(#sf-ground)"/>
  <g class="sfbloom">
    <rect width="1280" height="640" fill="url(#sf-bloomA)"/>
    <rect width="1280" height="640" fill="url(#sf-bloomB)"/>
    <rect width="1280" height="640" fill="url(#sf-bloomC)"/>
  </g>
  <g clip-path="url(#sf-frame)">
    <g transform="translate(0,320)">
      <ellipse class="sfwash" cx="0" cy="0" rx="520" ry="380" fill="url(#sf-wash)"/>
    </g>
  </g>
  <g transform="translate(872,126) scale(1.2188)">
  <g opacity="0.20" fill="url(#sf-ink)"><rect x="38" y="98" width="180" height="14" rx="7"/><rect x="38" y="126" width="132" height="14" rx="7"/><rect x="38" y="154" width="162" height="14" rx="7"/><circle cx="150" cy="133" r="7"/></g>
  <g class="sfscan">
    <g clip-path="url(#sf-lens)">
      <g class="sfscani" fill="url(#sf-ink)"><rect x="38" y="98" width="180" height="14" rx="7"/><rect x="38" y="126" width="132" height="14" rx="7"/><rect x="38" y="154" width="162" height="14" rx="7"/></g>
    </g>
  </g>
  <g class="sfflare" filter="url(#sf-glow-sm)" fill="url(#sf-ink)"><circle cx="150" cy="133" r="7"/></g>
  <g class="sfscan">
    <g filter="url(#sf-glow)">
      <line x1="159" y1="161" x2="196" y2="198" stroke="url(#sf-ink)"
            stroke-width="13" stroke-linecap="round"/>
      <circle cx="128" cy="130" r="44" fill="none" stroke="url(#sf-ink)" stroke-width="11"/>
    </g>
  </g>
  </g>
  <g filter="url(#sf-glow)">
    <text class="disp" x="96" y="358" font-size="122" font-weight="800"
          letter-spacing="-4.3" fill="url(#sf-word)">sniff</text>
  </g>
  <g clip-path="url(#sf-wordclip)">
    <g transform="skewX(-18)">
      <rect class="sfsheen" x="-38" y="236" width="56"
            height="165" fill="url(#sf-sheen)" opacity="0.45"/>
    </g>
  </g>
  <text class="mono eyebrow" x="96" y="258">BROWSER QA FOR YOUR RUNNING APP</text>
  <text class="disp head" x="96" y="416">Walks your app. Finds real bugs. Zero config.</text>
  <text class="disp sub" x="96" y="458">Autonomous flow-walk engine: broken pages, forms, a11y, console errors,</text>
  <text class="disp sub" x="96" y="490">each with screenshot proof. No API key.</text>
  <g transform="translate(0,506)"><rect x="96" y="0" width="200" height="38" rx="19" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/><text class="mono chipbig" x="118" y="25">507 tests pass</text><rect x="316" y="0" width="178" height="38" rx="19" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/><text class="mono chipbig" x="338" y="25">npx sniff-qa</text></g>
  <text class="mono tag" x="96" y="604">github.com/Aboudjem/sniff</text>
</svg>
