<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-label="How sniff works: crawl, act, assert, prove, report">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="60%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#07070C"/>
    </linearGradient>

    <radialGradient id="bloomg" cx="0.5" cy="1" r="0.8">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.25" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#FF2D78"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.1 0; 0.1 0; -0.1 0" dur="18s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="conn" gradientUnits="userSpaceOnUse" x1="232" y1="191" x2="272" y2="191">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="topline" gradientUnits="userSpaceOnUse" x1="40" y1="96" x2="1160" y2="96">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="32%" stop-color="#C77DFF" stop-opacity="0.3"/>
      <stop offset="72%" stop-color="#FF4D8D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF2D78" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .idx   { font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; fill: #FF4D8D; }
    .step  { font-size: 19px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.2px; }
    .sub   { font-size: 13px; font-weight: 500; fill: #B6C2DA; }
    .lead  { font-size: 15px; font-weight: 500; fill: #B6C2DA; }
    .chip  { font-size: 9.5px; letter-spacing: 0.6px; fill: #8494B0; }
    .warn  { font-size: 9.5px; letter-spacing: 0.6px; fill: #FFB341; }
    .pass  { font-size: 10.5px; letter-spacing: 1px; fill: #3DFFAB; }
    .foot  { font-size: 10.5px; letter-spacing: 1px; fill: #8494B0; }
    .btn   { font-size: 11px; font-weight: 600; fill: #FF4D8D; }

    @keyframes flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: flow 14s linear infinite; }

    @keyframes pip { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    .p1 { animation: pip 5s ease-in-out infinite 0s; }
    .p2 { animation: pip 5s ease-in-out infinite 0.35s; }
    .p3 { animation: pip 5s ease-in-out infinite 0.7s; }
    .p4 { animation: pip 5s ease-in-out infinite 1.05s; }
    .p5 { animation: pip 5s ease-in-out infinite 1.4s; }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .s1 { animation: rise 0.6s ease-out 0.30s both; }
    .s2 { animation: rise 0.6s ease-out 0.60s both; }
    .s3 { animation: rise 0.6s ease-out 0.90s both; }
    .s4 { animation: rise 0.6s ease-out 1.20s both; }
    .s5 { animation: rise 0.6s ease-out 1.50s both; }
    .sb { animation: rise 0.6s ease-out 1.85s both; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="360" fill="url(#ground)"/>
  <ellipse cx="600" cy="366" rx="700" ry="150" fill="url(#bloomg)"/>

  <text class="disp" x="40" y="56" font-size="34" font-weight="800" letter-spacing="-1" fill="url(#brand)">sniff</text>
  <text class="disp lead" x="40" y="82">It walks your real app in a real browser and reports what is actually broken, with proof.</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="url(#topline)" stroke-width="1.25"/>

  <!-- connectors -->
  <g>
    <line x1="232" y1="191" x2="268" y2="191" stroke="#1E2A42" stroke-width="1.25"/>
    <line class="flowline" x1="232" y1="191" x2="268" y2="191" stroke="url(#conn)" stroke-width="1.6" stroke-dasharray="3 7"/>
    <line x1="464" y1="191" x2="500" y2="191" stroke="#1E2A42" stroke-width="1.25"/>
    <line class="flowline" x1="464" y1="191" x2="500" y2="191" stroke="url(#conn)" stroke-width="1.6" stroke-dasharray="3 7"/>
    <line x1="696" y1="191" x2="732" y2="191" stroke="#1E2A42" stroke-width="1.25"/>
    <line class="flowline" x1="696" y1="191" x2="732" y2="191" stroke="url(#conn)" stroke-width="1.6" stroke-dasharray="3 7"/>
    <line x1="928" y1="191" x2="964" y2="191" stroke="#1E2A42" stroke-width="1.25"/>
    <line class="flowline" x1="928" y1="191" x2="964" y2="191" stroke="url(#conn)" stroke-width="1.6" stroke-dasharray="3 7"/>
    <g stroke="#FF4D8D" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M264 186 l6 5 l-6 5"/>
      <path d="M496 186 l6 5 l-6 5"/>
      <path d="M728 186 l6 5 l-6 5"/>
      <path d="M960 186 l6 5 l-6 5"/>
    </g>
  </g>

  <!-- 01 crawl -->
  <g class="s1">
    <rect x="40" y="112" width="192" height="160" rx="14" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <circle class="p1" cx="62" cy="136" r="3.6" fill="#FF4D8D" filter="url(#glow-sm)"/>
    <text class="mono idx"  x="76" y="140">01</text>
    <text class="disp step" x="60" y="176">Crawl</text>
    <text class="disp sub"  x="60" y="197">open the app</text>
    <g>
      <rect x="60" y="212" width="152" height="42" rx="7" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <line x1="60" y1="226" x2="212" y2="226" stroke="#1E2A42" stroke-width="1"/>
      <g fill="#5C6A85"><circle cx="70" cy="219" r="2.4"/><circle cx="78" cy="219" r="2.4"/><circle cx="86" cy="219" r="2.4"/></g>
      <g fill="#1E2A42"><rect x="70" y="234" width="70" height="5" rx="2.5"/><rect x="70" y="243" width="108" height="5" rx="2.5"/></g>
    </g>
  </g>

  <!-- 02 act -->
  <g class="s2">
    <rect x="272" y="112" width="192" height="160" rx="14" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <circle class="p2" cx="294" cy="136" r="3.6" fill="#FF4D8D" filter="url(#glow-sm)"/>
    <text class="mono idx"  x="308" y="140">02</text>
    <text class="disp step" x="292" y="176">Act</text>
    <text class="disp sub"  x="292" y="197">click &amp; fill flows</text>
    <g>
      <g fill="#1E2A42"><rect x="292" y="212" width="140" height="9" rx="4.5"/><rect x="292" y="226" width="104" height="9" rx="4.5"/></g>
      <rect x="292" y="242" width="72" height="22" rx="7" fill="none" stroke="#FF4D8D" stroke-width="1.1"/>
      <text class="disp btn" x="328" y="257" text-anchor="middle">Submit</text>
      <path d="M362 258 l0 14 l4 -4 l3 6 l3 -1.4 l-3 -6 l5.4 -0.5 z" fill="#F2F6FF" opacity="0.85"/>
    </g>
  </g>

  <!-- 03 assert -->
  <g class="s3">
    <rect x="504" y="112" width="192" height="160" rx="14" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <circle class="p3" cx="526" cy="136" r="3.6" fill="#FF4D8D" filter="url(#glow-sm)"/>
    <text class="mono idx"  x="540" y="140">03</text>
    <text class="disp step" x="524" y="176">Assert</text>
    <text class="disp sub"  x="524" y="197">diff state &amp; outcomes</text>
    <g>
      <rect x="524" y="212" width="70" height="24" rx="7" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <text class="mono chip" x="559" y="227" text-anchor="middle">expected</text>
      <rect x="606" y="212" width="70" height="24" rx="7" fill="#141C2E" stroke="#FF4D8D" stroke-opacity="0.5" stroke-width="1"/>
      <text class="mono chip" x="641" y="227" text-anchor="middle">actual</text>
      <path d="M594 224 h12" stroke="#1E2A42" stroke-width="1.25"/>
      <g fill="#1E2A42"><rect x="524" y="248" width="60" height="6" rx="3"/><rect x="606" y="248" width="42" height="6" rx="3"/></g>
    </g>
  </g>

  <!-- 04 prove -->
  <g class="s4">
    <rect x="736" y="112" width="192" height="160" rx="14" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <circle class="p4" cx="758" cy="136" r="3.6" fill="#FF4D8D" filter="url(#glow-sm)"/>
    <text class="mono idx"  x="772" y="140">04</text>
    <text class="disp step" x="756" y="176">Prove</text>
    <text class="disp sub"  x="756" y="197">screenshot + console/net</text>
    <g>
      <rect x="756" y="212" width="88" height="52" rx="7" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <g fill="#1E2A42"><rect x="766" y="222" width="46" height="5" rx="2.5"/><rect x="766" y="232" width="66" height="5" rx="2.5"/><rect x="766" y="242" width="34" height="5" rx="2.5"/></g>
      <path d="M766 254 h20" stroke="#FF4D8D" stroke-width="2" stroke-linecap="round"/>
      <rect x="854" y="226" width="60" height="22" rx="7" fill="none" stroke="#FFB341" stroke-opacity="0.55" stroke-width="1"/>
      <text class="mono warn" x="884" y="241" text-anchor="middle">ERR 500</text>
    </g>
  </g>

  <!-- 05 report -->
  <g class="s5">
    <rect x="968" y="112" width="192" height="160" rx="14" fill="#0E1524" stroke="#1E2A42" stroke-width="1"/>
    <circle class="p5" cx="990" cy="136" r="3.6" fill="#FF4D8D" filter="url(#glow-sm)"/>
    <text class="mono idx"  x="1004" y="140">05</text>
    <text class="disp step" x="988" y="176">Report</text>
    <text class="disp sub"  x="988" y="197">severity · confidence · fix</text>
    <g>
      <rect x="988" y="212" width="152" height="16" rx="6" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <rect x="988" y="212" width="112" height="16" rx="6" fill="#FF2D78" fill-opacity="0.5"/>
      <rect x="988" y="234" width="152" height="16" rx="6" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <rect x="988" y="234" width="76" height="16" rx="6" fill="#FF4D8D" fill-opacity="0.45"/>
      <rect x="988" y="256" width="152" height="16" rx="6" fill="#141C2E" stroke="#1E2A42" stroke-width="1"/>
      <rect x="988" y="256" width="44" height="16" rx="6" fill="#FFB341" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- footer -->
  <text class="mono foot" x="40" y="322">No finding ships without reproduction proof: the exact route · the ordered steps · screenshot · console/network excerpt.</text>
  <g class="sb">
    <rect x="874" y="306" width="286" height="26" rx="13" fill="none" stroke="#3DFFAB" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M890 319 l4 4 l7 -8" stroke="#3DFFAB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono pass" x="910" y="323">21 planted bugs · all 12 classes</text>
  </g>
</svg>
