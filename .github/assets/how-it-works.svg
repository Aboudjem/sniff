<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="How sniff works: Crawl, Act, Assert, Prove, Report" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title>How sniff works</title>
  <desc>A left-to-right pipeline with five animated stages: Crawl the running app, Act on real flows, Assert against expected state, Prove with screenshots and console/network evidence, then Report with severity, confidence and a fix.</desc>

  <defs>
    <!-- Subtle vertical sheen for the panel so it reads on light or dark backgrounds -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <!-- Accent gradient used on the connective rail -->
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .panel-border { stroke: #1e293b; }
      .stage { opacity: 0; animation: rise 0.7s ease-out forwards; }
      .s1 { animation-delay: 0.05s; }
      .s2 { animation-delay: 0.25s; }
      .s3 { animation-delay: 0.45s; }
      .s4 { animation-delay: 0.65s; }
      .s5 { animation-delay: 0.85s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse2 { animation: pulse 3.2s ease-in-out 1.6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 0.35; }
      }
      .glow { animation: glow 3.2s ease-in-out infinite; }
      @keyframes glow {
        0%, 100% { opacity: 0.0; }
        50%      { opacity: 0.55; }
      }
      .scan { animation: scan 2.6s ease-in-out infinite; transform-box: fill-box; }
      @keyframes scan {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: 0.9; }
        85%  { opacity: 0.9; }
        100% { transform: translateY(26px); opacity: 0; }
      }
      .cursor { animation: tap 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes tap {
        0%, 60%, 100% { transform: translate(0,0); }
        70%           { transform: translate(-2px,-2px); }
        80%           { transform: translate(0,0); }
      }
      .ring { animation: ring 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes ring {
        0%, 65%  { opacity: 0; transform: scale(0.4); }
        72%      { opacity: 0.7; transform: scale(0.4); }
        100%     { opacity: 0; transform: scale(1.6); }
      }
      .checkmark { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw 3s ease-in-out infinite; }
      @keyframes draw {
        0%, 20%  { stroke-dashoffset: 26; }
        45%, 80% { stroke-dashoffset: 0; }
        100%     { stroke-dashoffset: 26; }
      }
      .shot { animation: shot 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes shot {
        0%, 40%, 100% { transform: scale(1); }
        46%           { transform: scale(0.94); }
        52%           { transform: scale(1); }
      }
      .flash { animation: flash 3.4s ease-in-out infinite; }
      @keyframes flash {
        0%, 44%, 60%, 100% { opacity: 0; }
        48%, 52%           { opacity: 0.85; }
      }
      .bar { transform-box: fill-box; transform-origin: left center; animation: bargrow 0.8s ease-out forwards; opacity: 0; }
      .bar1 { animation-delay: 1.0s; }
      .bar2 { animation-delay: 1.15s; }
      .bar3 { animation-delay: 1.3s; }
      @keyframes bargrow {
        from { opacity: 0; transform: scaleX(0); }
        to   { opacity: 1; transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage, .bar { opacity: 1 !important; transform: none !important; animation: none !important; }
        .pulse, .pulse2, .glow, .scan, .cursor, .ring, .checkmark, .shot, .flash { animation: none !important; }
        .checkmark { stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

  <!-- Self-drawn panel so the graphic reads on both light and dark GitHub themes -->
  <rect x="2" y="2" width="1196" height="356" rx="20" fill="url(#panel)" class="panel-border" stroke-width="1.5"/>

  <!-- Heading -->
  <text x="40" y="50" font-size="22" font-weight="700" fill="#f1f5f9">How <tspan fill="#ef4444">sniff</tspan> works</text>
  <text x="40" y="74" font-size="13" fill="#94a3b8">It walks your real app in a real browser and reports what is actually broken — with proof.</text>

  <!-- ============================ CONNECTIVE RAIL ============================ -->
  <!-- The rail runs through the center of the five stage cards (y = 196). -->
  <line x1="150" y1="196" x2="1050" y2="196" stroke="url(#rail)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Traveling flow dot (SMIL) — loops gently left to right along the rail -->
  <circle r="16" fill="url(#spark)" filter="url(#soft)">
    <animate attributeName="cx" values="150;1050;1050" keyTimes="0;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="196" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#fff5f5">
    <animate attributeName="cx" values="150;1050;1050" keyTimes="0;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="196" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================ STAGE 1: CRAWL ================================ -->
  <g class="stage s1">
    <circle cx="150" cy="196" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="150" cy="196" r="3.5" fill="#ef4444" class="pulse"/>
    <rect x="70" y="108" width="160" height="118" rx="14" fill="#172033" stroke="#243349" stroke-width="1.5"/>
    <text x="150" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Crawl</text>
    <text x="150" y="153" text-anchor="middle" font-size="10.5" fill="#94a3b8">open the app</text>
    <!-- mini browser glyph with a scanning line -->
    <rect x="108" y="165" width="84" height="46" rx="6" fill="#0b1322" stroke="#334155" stroke-width="1.2"/>
    <line x1="108" y1="176" x2="192" y2="176" stroke="#334155" stroke-width="1"/>
    <circle cx="116" cy="170.5" r="2" fill="#ef4444"/>
    <circle cx="124" cy="170.5" r="2" fill="#475569"/>
    <circle cx="132" cy="170.5" r="2" fill="#475569"/>
    <rect x="114" y="182" width="40" height="4" rx="2" fill="#334155"/>
    <rect x="114" y="191" width="60" height="4" rx="2" fill="#243349"/>
    <rect x="114" y="200" width="28" height="4" rx="2" fill="#243349"/>
    <rect x="108" y="166" width="84" height="3" fill="#ef4444" class="scan"/>
  </g>

  <!-- ================================ STAGE 2: ACT ================================ -->
  <g class="stage s2">
    <circle cx="375" cy="196" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="375" cy="196" r="3.5" fill="#ef4444" class="pulse2"/>
    <rect x="295" y="108" width="160" height="118" rx="14" fill="#172033" stroke="#243349" stroke-width="1.5"/>
    <text x="375" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Act</text>
    <text x="375" y="153" text-anchor="middle" font-size="10.5" fill="#94a3b8">click &amp; fill flows</text>
    <!-- a form with a submit button + a tapping cursor -->
    <rect x="318" y="165" width="74" height="9" rx="3" fill="#0b1322" stroke="#334155" stroke-width="1"/>
    <rect x="318" y="179" width="74" height="9" rx="3" fill="#0b1322" stroke="#334155" stroke-width="1"/>
    <rect x="318" y="195" width="46" height="14" rx="4" fill="#ef4444"/>
    <text x="341" y="205" text-anchor="middle" font-size="8" font-weight="700" fill="#fff5f5">Submit</text>
    <g class="cursor">
      <circle cx="358" cy="202" r="11" fill="none" stroke="#fca5a5" stroke-width="1.5" class="ring"/>
      <path d="M388 196 L388 214 L393 209 L397 217 L400 215 L396 208 L403 208 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="1"/>
    </g>
  </g>

  <!-- ================================ STAGE 3: ASSERT ================================ -->
  <g class="stage s3">
    <circle cx="600" cy="196" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="600" cy="196" r="3.5" fill="#ef4444" class="pulse"/>
    <rect x="520" y="108" width="160" height="118" rx="14" fill="#172033" stroke="#243349" stroke-width="1.5"/>
    <text x="600" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Assert</text>
    <text x="600" y="153" text-anchor="middle" font-size="10.5" fill="#94a3b8">diff state &amp; outcomes</text>
    <!-- expected vs actual, a check being drawn -->
    <text x="552" y="178" text-anchor="middle" font-size="8" fill="#64748b">expected</text>
    <text x="648" y="178" text-anchor="middle" font-size="8" fill="#64748b">actual</text>
    <rect x="535" y="184" width="34" height="22" rx="5" fill="#0b1322" stroke="#334155" stroke-width="1"/>
    <rect x="631" y="184" width="34" height="22" rx="5" fill="#0b1322" stroke="#334155" stroke-width="1"/>
    <path d="M583 196 L597 196" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="600" cy="196" r="11" fill="#0b1322" stroke="#22c55e" stroke-width="1.5" opacity="0.0" class="glow"/>
    <path d="M592 196 L598 202 L609 190" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="checkmark"/>
  </g>

  <!-- ================================ STAGE 4: PROVE ================================ -->
  <g class="stage s4">
    <circle cx="825" cy="196" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="825" cy="196" r="3.5" fill="#ef4444" class="pulse2"/>
    <rect x="745" y="108" width="160" height="118" rx="14" fill="#172033" stroke="#243349" stroke-width="1.5"/>
    <text x="825" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Prove</text>
    <text x="825" y="153" text-anchor="middle" font-size="10.5" fill="#94a3b8">screenshot + console/net</text>
    <!-- camera capturing a frame + a console line -->
    <g class="shot">
      <rect x="772" y="170" width="54" height="40" rx="6" fill="#0b1322" stroke="#334155" stroke-width="1.2"/>
      <rect x="784" y="166" width="14" height="6" rx="2" fill="#334155"/>
      <circle cx="799" cy="190" r="11" fill="none" stroke="#475569" stroke-width="2"/>
      <circle cx="799" cy="190" r="5" fill="#ef4444"/>
    </g>
    <rect x="772" y="170" width="54" height="40" rx="6" fill="#fecaca" class="flash"/>
    <!-- console / network excerpt -->
    <rect x="836" y="170" width="56" height="40" rx="5" fill="#0b1322" stroke="#334155" stroke-width="1"/>
    <text x="842" y="184" font-size="7.5" font-family="monospace" fill="#fca5a5">ERR 500</text>
    <rect x="842" y="190" width="38" height="3" rx="1.5" fill="#334155"/>
    <rect x="842" y="197" width="44" height="3" rx="1.5" fill="#334155"/>
    <rect x="842" y="204" width="30" height="3" rx="1.5" fill="#243349"/>
  </g>

  <!-- ================================ STAGE 5: REPORT ================================ -->
  <g class="stage s5">
    <circle cx="1050" cy="196" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="1050" cy="196" r="3.5" fill="#ef4444" class="pulse"/>
    <rect x="970" y="108" width="160" height="118" rx="14" fill="#1a0f14" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="1050" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Report</text>
    <text x="1050" y="153" text-anchor="middle" font-size="10.5" fill="#fca5a5">severity · confidence · fix</text>
    <!-- finding rows that fill in -->
    <rect x="986" y="166" width="8" height="8" rx="2" fill="#ef4444"/>
    <rect x="1000" y="167" width="118" height="6" rx="3" fill="#3a2226" class="bar bar1" transform-origin="1000px 170px"/>
    <rect x="986" y="182" width="8" height="8" rx="2" fill="#f59e0b"/>
    <rect x="1000" y="183" width="100" height="6" rx="3" fill="#3a2226" class="bar bar2" transform-origin="1000px 186px"/>
    <rect x="986" y="198" width="8" height="8" rx="2" fill="#22c55e"/>
    <rect x="1000" y="199" width="84" height="6" rx="3" fill="#3a2226" class="bar bar3" transform-origin="1000px 202px"/>
    <text x="986" y="218" font-size="8.5" fill="#fca5a5" font-weight="600">21 findings · 100% with proof</text>
  </g>

  <!-- Footer caption -->
  <text x="600" y="330" text-anchor="middle" font-size="11.5" fill="#64748b">No finding ships without reproduction proof: exact route · ordered steps · screenshot · console/network excerpt.</text>
</svg>
