name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # Pinned: Playwright 1.59 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing (>=11.5.1)
        # Pinned to the npm 11 line on purpose. npm@latest is now 12.x, whose engines field
        # requires node ^22.22.2 || ^24.15.0 || >=26.0.0, so it fails EBADENGINE against the
        # node-version pinned above. npm 11 needs only >=22.9.0 and still supports OIDC
        # trusted publishing, which is all this step is here to guarantee.
        run: |
          CURRENT=$(npm --version)
          echo "Node $(node --version), npm $CURRENT"
          node -e "
          const [a,b,c] = process.argv[1].split('.').map(n => parseInt(n,10));
          const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
          if (!ok) { console.log('Upgrading npm from', process.argv[1], 'to >=11.5.1'); }
          process.exit(ok ? 0 : 42);
          " "$CURRENT" || npm install -g npm@11
          echo "Using npm $(npm --version)"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # Build first: the cold-start test runs the built `sniff-qa --mcp`.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm with provenance (OIDC)
        run: npm publish --provenance --access public

      - name: Extract this version's CHANGELOG section as release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ "$(wc -w < release-notes.md)" -lt 12 ]; then
            echo "CHANGELOG.md has no real section for $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  mcp-registry:
    name: Publish to the MCP registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Check server.json matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "const s=require('./server.json'); const v=process.argv[1]; if (s.version!==v || s.packages[0].version!==v) { console.error('server.json is not at ' + v); process.exit(1); }" "$TAG_VERSION"

      # The registry checks that npm serves this version. npm can take a minute or two to
      # serve a fresh publish, so v0.9.0 failed here with a 404. Wait for it first.
      - name: Wait until npm serves this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "sniff-qa@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves sniff-qa@$VERSION"; exit 0
            fi
            sleep 10
          done
          echo "npm does not serve sniff-qa@$VERSION after 5 minutes"; exit 1

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  sync-10x:
    name: Sync 10x marketplace
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Dispatch plugin-released to 10x
        env:
          DISPATCH_TOKEN: ${{ secrets.TEN_X_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "TEN_X_DISPATCH_TOKEN secret not set; skipping 10x sync."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aboudjem/10x/dispatches \
            -d "{\"event_type\":\"plugin-released\",\"client_payload\":{\"plugin\":\"sniff\",\"version\":\"$VERSION\"}}")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "10x dispatch failed with HTTP $HTTP_CODE:"
            cat /tmp/dispatch.json
            echo "Rotate TEN_X_DISPATCH_TOKEN at https://github.com/Aboudjem/sniff/settings/secrets/actions"
            exit 1
          fi
          echo "10x dispatch succeeded (HTTP 204)."
